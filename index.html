<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COSEINCO — Flota y CRM</title>
<style>
:root{
  --bg:#eef0ec;--surface:#ffffff;--surface2:#f6f7f4;--ink:#1b2124;--muted:#5b6763;--line:#d5dad5;--line2:#e6e9e5;
  --accent:#0d6a4d;--accent-ink:#ffffff;--accent-soft:#e1efe8;--series2:#35597d;
  --amber-bg:#fff2c8;--amber-line:#c7891a;--amber-ink:#5b3d00;
  --neg:#b3261e;--warn:#9a5b00;--ok:#0d6a4d;--focus:#1f6fd1;
  --odo-bg:#1b2124;--odo-ink:#f3f5f1;
  --f-sign:Bahnschrift,"DIN Alternate","DIN 2014","D-DIN","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1312;--surface:#161c1a;--surface2:#1b2220;--ink:#e5eae7;--muted:#98a6a0;--line:#2b3431;--line2:#222a28;
  --accent:#56c49c;--accent-ink:#06140f;--accent-soft:#18302a;--series2:#8db4dc;
  --amber-bg:#3a2e0e;--amber-line:#d9a441;--amber-ink:#ffe3a6;
  --neg:#ff8b82;--warn:#f0b35a;--ok:#56c49c;--focus:#7fb2ff;--odo-bg:#050807;--odo-ink:#e5eae7;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1312;--surface:#161c1a;--surface2:#1b2220;--ink:#e5eae7;--muted:#98a6a0;--line:#2b3431;--line2:#222a28;
  --accent:#56c49c;--accent-ink:#06140f;--accent-soft:#18302a;--series2:#8db4dc;
  --amber-bg:#3a2e0e;--amber-line:#d9a441;--amber-ink:#ffe3a6;
  --neg:#ff8b82;--warn:#f0b35a;--ok:#56c49c;--focus:#7fb2ff;--odo-bg:#050807;--odo-ink:#e5eae7;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);padding:6px 10px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* navegación */
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.brand b{display:block;font:600 20px/1.1 var(--f-sign);letter-spacing:.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.nav h3{font:500 12px/1 var(--f-sign);color:var(--muted);margin:16px 10px 6px;letter-spacing:.04em}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a .k{font:600 12px/1 var(--f-sign);color:var(--muted);width:14px}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav a[aria-current="page"] .k{color:var(--accent-ink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top h1{font:600 22px/1.2 var(--f-sign);margin:0;flex:1 1 auto;min-width:180px}
.top .sub{display:block;font:400 12.5px/1.3 var(--f-body);color:var(--muted)}
.vsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input.f,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;background:var(--surface);cursor:pointer}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.badge.warn i{background:var(--warn)}.badge.err i{background:var(--neg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn{text-decoration:none}a.btn{color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:3px 8px;min-height:26px;font-size:12.5px}
.btn.icon{padding:6px 9px}
#view{padding:22px 24px 60px;max-width:1500px;width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.bar .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.card h2{font:600 17px/1.25 var(--f-sign);margin:0 0 10px}
.card h2 small{font:400 13px var(--f-body);color:var(--muted);margin-left:6px}
.muted{color:var(--muted)}.small{font-size:12.5px}
p{max-width:78ch}
a{color:var(--accent)}
td.lbl a{font-weight:600;text-decoration:none}td.lbl a:hover{text-decoration:underline}
/* leyenda */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:34px;height:18px;border-radius:3px;border:1px solid var(--line);background:var(--surface);position:relative;font:11px/16px var(--f-body);text-align:center}
.sw.u{background:var(--amber-bg);border-color:var(--amber-line)}
.sw.s{border:0;border-bottom:1.5px dotted var(--muted);border-radius:0;background:transparent}
.sw.o{background:var(--amber-bg);border-color:var(--amber-line)}
.sw.o::after,input.ovr+.corner{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--amber-line) transparent transparent}
/* rejillas */
.gw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:calc(100vh - 230px)}
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
table.g th,table.g td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0;height:32px;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--surface2);font:500 12.5px/1.2 var(--f-sign);color:var(--muted);padding:6px 8px;text-align:right;z-index:3;vertical-align:bottom;white-space:normal}
table.g thead tr.grp th{top:0;text-align:left;color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
table.g thead tr.h2 th{top:30px}
table.g thead th.l{text-align:left}
table.g .stk{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
table.g thead .stk{z-index:4;background:var(--surface2)}
table.g td.num,table.g td.c{padding:0 10px;text-align:right}
table.g td.c.l{text-align:left}
table.g td.lbl{padding:0 12px;text-align:left;font-weight:500}
table.g tfoot td{background:var(--surface2);font-weight:600;position:sticky;bottom:0;z-index:1}
table.g tfoot td.stk{z-index:3}
table.g tr:hover td{background-image:linear-gradient(var(--line2),var(--line2))}
table.g tr.tot td{font-weight:600;border-top:1.5px solid var(--line)}
td .rn{display:inline-block;width:26px;color:var(--muted);font-size:12px;text-align:right;margin-right:6px}
.cellw{position:relative;height:100%}
input.cell,select.cell{width:100%;height:31px;border:0;border-radius:0;background:transparent;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
select.cell{text-align:left;padding-right:2px;appearance:auto}
input.cell.t{text-align:left}
input.cell.u,select.cell.u{background:var(--amber-bg)}
input.cell.sug{background:linear-gradient(90deg,var(--muted) 45%,transparent 45%) left bottom 6px/4px 1.5px repeat-x;background-origin:content-box;background-clip:content-box}
input.cell.ovr{background:var(--amber-bg);box-shadow:inset 0 0 0 1px var(--amber-line)}
input.cell:focus,select.cell:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--surface)}
input.cell.bad{box-shadow:inset 0 0 0 2px var(--neg)}
.neg{color:var(--neg)}.err{color:var(--neg);font-size:11.5px;opacity:.85}.z{color:var(--muted)}
.w-date{width:128px}.w-s{width:84px}.w-m{width:106px}.w-l{width:150px}.w-xl{width:210px}.w-n{width:92px}
.acts{display:flex;gap:4px;padding:0 6px;align-items:center;height:31px}
.hidden{display:none!important}
.aux{display:none}.show-aux .aux{display:table-cell}
/* resumen */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.odo-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px}
.odo-card p{margin:0 0 12px;color:var(--muted)}
.odo{display:flex;gap:4px;align-items:stretch}
.odo span{background:var(--odo-bg);color:var(--odo-ink);font:600 clamp(28px,4.4vw,52px)/1 var(--f-sign);padding:10px 7px 8px;border-radius:4px;min-width:1.05em;text-align:center;box-shadow:inset 0 -10px 12px rgba(0,0,0,.35),inset 0 10px 12px rgba(0,0,0,.35)}
.odo span.last{background:var(--accent);color:var(--accent-ink)}
.odo em{font:500 16px var(--f-sign);align-self:flex-end;margin-left:8px;font-style:normal;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font:600 22px/1.2 var(--f-sign);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font:12px var(--f-body)}
svg.ch .gl{stroke:var(--line2)}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb .v{font-variant-numeric:tabular-nums;text-align:right}
ul.al{list-style:none;margin:0;padding:0}
ul.al li{padding:7px 0;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:baseline}
ul.al li:last-child{border:0}
ul.al .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn);transform:translateY(-1px)}
ul.al .dot.err{background:var(--neg)}
ul.al button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:12.5px}
.empty{text-align:left;padding:40px 36px;max-width:640px}
.empty h2{font:600 26px/1.2 var(--f-sign);margin:0 0 8px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label input,.form label select{color:var(--ink)}
.form label input.u,.form label select.u{background:var(--amber-bg);border-color:var(--amber-line)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lists textarea{width:100%;min-height:190px;background:var(--amber-bg);border-color:var(--amber-line);line-height:1.6}
dl.gl{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:8px 18px;margin:0}
dl.gl dt{font-weight:600}dl.gl dd{margin:0;color:var(--muted)}
code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
/* modal y aviso */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:460px;width:100%;padding:20px 22px}
.dlg h3{font:600 18px var(--f-sign);margin:0 0 8px}
.dlg .bar{justify-content:flex-end;margin:16px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;z-index:95;max-width:90vw}
.ptitle{display:none}
/* móvil */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;top:0;height:auto;display:flex;align-items:center;gap:4px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);z-index:30;top:env(safe-area-inset-top,0px)}
  .brand,.nav h3{display:none}
  .nav a{flex:none;padding:7px 11px}
  .top{position:static;padding:12px 14px}
  #view{padding:16px 14px 50px}
  .hero,.cols{grid-template-columns:1fr}
  .gw{max-height:none}
  dl.gl{grid-template-columns:1fr}dl.gl dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000;font-size:11px}
  .nav,.top,.bar,.legend,.acts,.noprint,#toast{display:none!important}
  .app{display:block}#view{padding:0;max-width:none}
  .ptitle{display:block;font:600 16px var(--f-sign);margin:0 0 8px}
  .gw{max-height:none;overflow:visible;border:0}
  table.g{width:100%}table.g .stk,table.g thead th,table.g tfoot td{position:static}
  input.cell,select.cell{background:none!important;box-shadow:none!important;text-decoration:none!important;appearance:none}
  .card{border:0;padding:0;break-inside:avoid}
}

/* ===== CRM ===== */
:root{--lost:#c4605a;--good-bg:#dcefe4;--good-ink:#0b5a40;--bad-bg:#f8e0de;--bad-ink:#9b2a22;--info-bg:#e3ecf5;--info-ink:#2a4d72}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lost:#e08a84;--good-bg:#15342a;--good-ink:#8fe0bf;--bad-bg:#3b1f1d;--bad-ink:#ffb0a9;--info-bg:#1b2a3a;--info-ink:#a9c8ea}}
:root[data-theme="dark"]{--lost:#e08a84;--good-bg:#15342a;--good-ink:#8fe0bf;--bad-bg:#3b1f1d;--bad-ink:#ffb0a9;--info-bg:#1b2a3a;--info-ink:#a9c8ea}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tl{font:500 13px var(--f-sign);color:var(--muted)}
.tile b{font:600 clamp(22px,2.2vw,30px)/1.15 var(--f-sign);font-variant-numeric:tabular-nums;margin:6px 0 2px;overflow-wrap:anywhere}
.tile .tm{font-size:13px;font-weight:600}.tile .ts{font-size:12.5px;color:var(--muted)}
.tile.good{background:var(--good-bg);border-color:transparent}.tile.good .tm{color:var(--good-ink)}
.tile.bad{background:var(--bad-bg);border-color:transparent}.tile.bad .tm{color:var(--bad-ink)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
table.mini{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.mini th{font:500 12px var(--f-sign);color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
table.mini td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.mini .l{text-align:left;white-space:normal}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font:inherit}
.lnk:hover{text-decoration:underline}
.card h2 small .lnk{font-size:13px}
.chip{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap;vertical-align:1px}
.chip.ok{background:var(--good-bg);color:var(--good-ink);border-color:transparent}.chip.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
.chip.warn{background:var(--amber-bg);color:var(--amber-ink);border-color:transparent}.chip.info{background:var(--info-bg);color:var(--info-ink);border-color:transparent}.chip.mute{color:var(--muted)}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font:600 12px var(--f-sign);flex:none}
.av.sm{width:22px;height:22px;font-size:10px}.av.lg{width:52px;height:52px;font-size:18px}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kc{flex:0 0 238px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kc header{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.kc header b{font:600 14px var(--f-sign)}.kc header span{font:600 13px var(--f-sign);color:var(--muted)}.kc header small{margin-left:auto;color:var(--muted)}
.kc.ganado header{box-shadow:inset 0 3px 0 var(--accent)}.kc.perdido header{box-shadow:inset 0 3px 0 var(--lost)}
.kcb{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:90px;flex:1}
.kc.over{outline:2px dashed var(--accent);outline-offset:-3px}
.kc footer{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.kd{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:grab}
.kd:hover{border-color:var(--muted)}.kd.drag{opacity:.45}
.kd .sg{display:flex;gap:3px;margin-bottom:6px}.kd .sg i{flex:1;height:3px;border-radius:2px;background:var(--line)}.kd .sg i.on{background:var(--accent)}.kd .sg i.lost{background:var(--lost)}
.kd .kt{font-weight:600;font-size:13.5px;line-height:1.3}
.kd .km{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.kd .kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}.kd .kv b{font:600 15px var(--f-sign)}
.kd .kf{display:flex;align-items:center;gap:6px;margin-top:8px}
.vtag,.ptag{margin-left:auto;font-size:11.5px;color:var(--muted)}.ptag{background:var(--amber-bg);color:var(--amber-ink);padding:0 6px;border-radius:4px}
.vtag+.ptag{margin-left:4px}
/* fichas */
.p3{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:16px;align-items:start}
.p2{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.pl input.f{width:100%}.h2s{font:600 16px var(--f-sign);margin:2px 4px}
.seg.full{display:flex}.seg.full button{flex:1}.btn.full{width:100%;justify-content:center}

var Motor = (function () {
  'use strict';
  var DIV0 = '#DIV/0!';
  function isErr(x) { return typeof x === 'string' && x.charAt(0) === '#'; }

  function periodoDe(fecha) { return (typeof fecha === 'string' && /^\d{4}-\d{2}/.test(fecha)) ? fecha.slice(0, 7) : null; }

    var filas = [], prev = null;
    for (var i = 0; i < regs.length; i++) {
      var r = regs[i], f = {};
      // D: Km inicio. Sugerido = Km término de la fila anterior (UserForm2.cont); sobrescribible.
      f.dDef = prev ? prev.E : null;
      f.D = !blank(r.kmIni) ? +r.kmIni : f.dDef;
      f.E = blank(r.kmFin) ? null : +r.kmFin;
      f.G = blank(r.litros) ? null : +r.litros;
      // H: Precio. Sugerido = precio de la fila anterior (UserForm2.cont); sobrescribible.
      f.hDef = prev ? prev.H : null;
      f.H = !blank(r.precio) ? +r.precio : f.hDef;
      f.F = sub(f.E, f.D);                               // =E-D
      f.iDef = mul(f.G, f.H);                            // =G*H  (celda desbloqueada)
      f.I = !blank(r.total) ? +r.total : f.iDef;
      f.N = div(f.F, f.G);                               // =SUM(F/G)
      var jBlank = blank(r.combustible);                  // J=0 es VERDADERO solo si J está vacía
      f.U = n(f.G);                                      // =G
      if (i === 0) {
        f.R = n(f.G); f.S = n(f.I); f.T = f.U; f.V = f.S; f.W = f.F;
      } else {
        f.R = add(f.G, prev.R); f.S = add(f.I, prev.S); f.T = add(prev.T, f.G);
        f.V = add(prev.V, f.I); f.W = add(prev.W, f.F);
      }
      // Q "Km recorridos": original =IF(J=0,0,F/I) ; corregido =IF(J=0,0,W) (km acumulados)
      f.Q = jBlank ? 0 : (modo === 'original' ? div(f.F, f.I) : f.W);
      if (i === 0) { f.O = null; f.P = null; }           // fila 6 no tiene fórmula en O ni P
      else if (isErr(f.Q)) { f.O = f.Q; f.P = f.Q; }     // Q="Error" propaga el error
      else if (eqText(r.llenado, 'Parcial')) { f.O = 0; f.P = 0; }
      else { f.O = mul(div(f.R, f.Q), 100); f.P = div(f.S, f.Q); }
      f.periodo = periodoDe(r.fecha);
      filas.push(f); prev = f;
    }
    return filas;
  }

  /* Hoja de mantenimiento (Modelo1 / "xxx_MANT"): resumen H7:X29 */
  function calcResumen(v, filasComb, per, tipos, modo) {
    var ovr = v.over || {};
    function fila(clave, defs) {
      var o = ovr[clave] || {}, vals = [], esOvr = [];
      for (var k = 0; k < per.length; k++) {
        var ov = o[per[k]];
        var has = !(ov === null || ov === undefined || ov === '');
        vals.push(has ? +ov : defs[k]); esOvr.push(has);
      }
      var tot = 0; for (var j = 0; j < vals.length; j++) tot = add(tot, vals[j]);
      return { clave: clave, def: defs, vals: vals, ovr: esOvr, total: tot };
    }
    function sumaPor(lista, campo, filtro) {
      return per.map(function (p) {
        var s = 0;
        lista.forEach(function (x, idx) { if (filtro(x, idx) && x.periodo === p) s = add(s, campo(x, idx)); });
        return s;
      });
    }
    var todos = function () { return true; };
    // Filas 7-9: en el Excel se llenan a mano. Sugerido = suma de la bitácora de combustible del mes.
    var km = fila('km', sumaPor(filasComb, function (x) { return x.F; }, todos));
    var litros = fila('litros', sumaPor(filasComb, function (x) { return n(x.G); }, todos));
    var soles = fila('soles', sumaPor(filasComb, function (x) { return x.I; }, todos));
    var mant = (v.mant || []).map(function (m) { return { tipo: m.tipo, imp: n(blank(m.importe) ? 0 : +m.importe), periodo: periodoDe(m.fecha) }; });
    // Filas 12-25: secciones. Sugerido = suma de gastos del tipo en el mes (la macro solo escribía el último).
    var secciones = tipos.map(function (t) {
      return fila('sec:' + t, sumaPor(mant, function (x) { return x.imp; }, function (x) { return (x.tipo || '').toLowerCase() === t.toLowerCase(); }));
    });
    var gastosMes = per.map(function (p, k) { var s = 0; secciones.forEach(function (sx) { s = add(s, sx.vals[k]); }); return s; }); // J29:U29
    var totalGastos = 0; gastosMes.forEach(function (g) { totalGastos = add(totalGastos, g); });               // V29
    var totalSecciones = 0; secciones.forEach(function (sx) { totalSecciones = add(totalSecciones, sx.total); }); // V26
    // X12:X25: original =IF($P$29=0,0,V/$P$29) (P29 = 7.º mes) ; corregido usa $V$29 (total anual)
    var den = modo === 'original' ? gastosMes[6] : totalGastos;
    secciones.forEach(function (sx) { sx.pct = isErr(den) ? den : (n(den) === 0 ? 0 : div(sx.total, den)); });
    return { periodos: per, km: km, litros: litros, soles: soles, secciones: secciones, gastosMes: gastosMes, totalGastos: totalGastos, totalSecciones: totalSecciones };
  }

  function num0(x) { return isErr(x) || x === null ? 0 : x; }

  function calcular(estado) {
    var aj = estado.ajustes || {}, modo = aj.modoFormulas === 'original' ? 'original' : 'corregido';
    var per = periodos(aj.anio || new Date().getFullYear(), aj.mesInicio || 1);
    var tipos = (estado.listas && estado.listas.tiposGasto) || [];
    var res = { modo: modo, periodos: per, vehiculos: {}, alertas: [], flota: null };
    var fl = { km: 0, litros: 0, soles: 0, mant: 0, porMesComb: per.map(function () { return 0; }), porMesMant: per.map(function () { return 0; }), porTipo: {} };
    tipos.forEach(function (t) { fl.porTipo[t] = 0; });
    (estado.vehiculos || []).forEach(function (v) {
      var filas = calcCombustible(v.combustible || [], modo);
      var rs = calcResumen(v, filas, per, tipos, modo);
      // alertas
      filas.forEach(function (f, i) {
        var r = v.combustible[i], ref = { veh: v.id, vista: 'combustible', fila: i };
        if (!blank(f.E) && !blank(f.D) && f.E < f.D) res.alertas.push(Object.assign({ tipo: 'err', txt: v.nombre + ', fila ' + (i + 1) + ': el km de término es menor que el de inicio.' }, ref));
        else if (blank(f.E) && !blank(f.G)) res.alertas.push(Object.assign({ tipo: 'err', txt: v.nombre + ', fila ' + (i + 1) + ': falta el km de término; los km quedan negativos.' }, ref));
        if (i > 0 && !blank(r.kmIni) && filas[i - 1].E !== null && +r.kmIni !== filas[i - 1].E) res.alertas.push(Object.assign({ tipo: 'warn', txt: v.nombre + ', fila ' + (i + 1) + ': el km de inicio no coincide con el término anterior (' + filas[i - 1].E + ').' }, ref));
        if (blank(r.combustible) && !blank(f.G)) res.alertas.push(Object.assign({ tipo: 'warn', txt: v.nombre + ', fila ' + (i + 1) + ': sin tipo de combustible; el Excel deja Km recorridos en 0 y el consumo da #DIV/0!.' }, ref));
        if (!f.periodo) res.alertas.push(Object.assign({ tipo: 'warn', txt: v.nombre + ', fila ' + (i + 1) + ': sin fecha; no entra al resumen mensual.' }, ref));
      });
      (v.mant || []).forEach(function (m, i) {
        if (m.tipo && tipos.map(function (t) { return t.toLowerCase(); }).indexOf(m.tipo.toLowerCase()) < 0)
          res.alertas.push({ tipo: 'warn', veh: v.id, vista: 'mantenimiento', fila: i, txt: v.nombre + ', gasto ' + (i + 1) + ': el tipo "' + m.tipo + '" no está en la lista de secciones.' });
      });
      var last = filas.length ? filas[filas.length - 1] : null;
      var enVentana = filas.filter(function (f) { return f.periodo && per.indexOf(f.periodo) >= 0; });
      var kmV = num0(rs.km.total), ltV = num0(rs.litros.total), sV = num0(rs.soles.total), mV = num0(rs.totalGastos);
      res.vehiculos[v.id] = {
        filas: filas, resumen: rs,
        kpi: { km: kmV, litros: ltV, soles: sV, mant: mV, rend: ltV ? kmV / ltV : null, costoKm: kmV ? (sV + mV) / kmV : null,
               odometro: last ? last.E : null, ultConsumo: last ? last.O : null, cargas: enVentana.length }
      };
      fl.km += kmV; fl.litros += ltV; fl.soles += sV; fl.mant += mV;
      per.forEach(function (p, k) { fl.porMesComb[k] += num0(rs.soles.vals[k]); fl.porMesMant[k] += num0(rs.gastosMes[k]); });
      rs.secciones.forEach(function (sx, k) { fl.porTipo[tipos[k]] += num0(sx.total); });
    });
    fl.rend = fl.litros ? fl.km / fl.litros : null;
    fl.costoKm = fl.km ? (fl.soles + fl.mant) / fl.km : null;
    res.flota = fl;
    return res;
  }

  return { calcular: calcular, periodos: periodos, isErr: isErr, DIV0: DIV0, _calcCombustible: calcCombustible };
})();
if (typeof module !== 'undefined') module.exports = Motor;

<script>
/* Motor CRM — módulo puro: CRM.calcular(estado, hoyISO, periodos, filtros) -> resultados. No toca el DOM. */
var CRM = (function () {
  'use strict';
  var IGV = 0.18;
  function r2(x) { return Math.round((+x || 0) * 100) / 100; }
  function dias(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }

  function per(f) { return (typeof f === 'string' && /^\d{4}-\d{2}/.test(f)) ? f.slice(0, 7) : null; }

  function base() {
    return {
      etapas: [
        { id: 'e1', nombre: 'Prospecto', prob: 10, tipo: 'abierta' },
        { id: 'e2', nombre: 'Calificado', prob: 30, tipo: 'abierta' },
        { id: 'e3', nombre: 'Propuesta', prob: 60, tipo: 'abierta' },
        { id: 'e4', nombre: 'Negociación', prob: 80, tipo: 'abierta' },
        { id: 'eg', nombre: 'Ganado', prob: 100, tipo: 'ganado' },
        { id: 'ep', nombre: 'Perdido', prob: 0, tipo: 'perdido' }
      ],
      propietarios: ['Equipo comercial'],
      fuentes: ['Formulario web', 'Facebook Lead Ads', 'Instagram', 'WhatsApp', 'Referido', 'Manual', 'API'],
      motivosPerdida: ['Precio', 'Eligió a la competencia', 'Sin presupuesto', 'Sin respuesta', 'Otro'],
      metas: { anual: 0, mensual: 0, tasaCierre: 0 },
      empresas: [], contactos: [], leads: [], deals: [], pagos: [], campanias: [], actividades: [], enviados: {},
      seq: { F001: 0, B001: 0 }

  }
  function migrar(c) {

    Object.keys(b).forEach(function (k) {

    c.campanias.forEach(function (x) { if (!Array.isArray(x.pasos)) x.pasos = []; if (!Array.isArray(x.inscritos)) x.inscritos = []; });
    return c;

  function etapaMap(c) { var m = {}; c.etapas.forEach(function (e) { m[e.id] = e; }); return m; }
  function primeraAbierta(c) { return c.etapas.filter(function (e) { return e.tipo === 'abierta'; })[0] || c.etapas[0]; }

  function enriquecerDeal(d, et, c) {
    var e = et[d.etapaId] || primeraAbierta(c);
    var tipo = e.tipo, probDef = e.prob;
    var prob = tipo === 'ganado' ? 100 : tipo === 'perdido' ? 0 : (d.prob === null || d.prob === undefined ? probDef : +d.prob);
    var valor = +d.valor || 0;
    return {
      id: d.id, d: d, etapa: e, estado: tipo === 'abierta' ? 'abierto' : tipo, prob: prob, probDef: probDef,
      valor: valor, ponderado: r2(valor * prob / 100)
    };

  function bucket(dd) {
    if (dd === null) return 'Sin fecha de cierre';
    if (dd < 0) return 'Vencidas';
    if (dd <= 7) return 'Próximos 7 días';
    if (dd <= 30) return 'Próximos 30 días';
    return 'Más adelante';
  }

  function calcular(estado, hoy, periodos, filtros) {
    var c = estado.crm, f = filtros || {}, et = etapaMap(c);
    var pasa = function (d) { return (!f.propietario || d.propietario === f.propietario) && (!f.fuente || d.fuente === f.fuente); };
    var deals = c.deals.map(function (d) {
      var x = enriquecerDeal(d, et, c);
      x.diasCierre = d.fechaCierre ? dias(hoy, d.fechaCierre) : null;
      x.vencido = x.estado === 'abierto' && x.diasCierre !== null && x.diasCierre < 0;
      return x;
    });
    var vis = deals.filter(function (x) { return pasa(x.d); });

    + '<dt>Sección (V)</dt><dd><code>=SUM(J:U)</code> por fila. Total secciones <code>=SUM(V12:V25)</code>.</dd>'
    + '<dt>% gastos (X)</dt><dd>Original: <code>=IF($P$29=0,0,V/$P$29)</code> — divide entre el gasto de julio. Corregido: divide entre el total anual <code>$V$29</code>.</dd>'
    + '<dt>Gastos del mes (fila 29)</dt><dd><code>=SUM(J12:J25)</code> por mes y total <code>=SUM(J29:U29)</code>.</dd></dl></div>'
    + '<div class="card"><h2>Otros términos</h2><dl class="gl"><dt>Parcial</dt><dd>Carga que no llena el tanque: no se calcula consumo ni costo por km.</dd><dt>IGV</dt><dd>Impuesto General a las Ventas, 18%. Si los precios lo incluyen, IGV = total − total ÷ 1.18.</dd><dt>Periodo</dt><dd>12 meses desde el mes y año de inicio (Ajustes).</dd><dt>Cierre de periodo</dt><dd>Respaldo y vaciado de bitácoras, en lugar de exportar PDF y enviar por Outlook.</dd></dl></div>';
}

/* ---------- edición ---------- */
function aplicarEdicion(el) {
  var d = el.dataset, i = +d.i, v = veh(), val;
  var esNum = el.hasAttribute('data-dec');
  if (esNum) { val = parseNum(el.value); if (isNaN(val)) { el.classList.add('bad'); return; } el.classList.remove('bad'); }
  else val = el.value;
  if (d.t === 'c') v.combustible[i][d.k] = val;
  else if (d.t === 'm') v.mant[i][d.k] = val;
  else if (d.t === 'ch') S.choferes[i][d.k] = val;
  else if (d.t === 'vh' && d.k === 'empresaId') { S.vehiculos[i].empresaId = val || null; }
  else if (d.t === 'vh') { var x = S.vehiculos[i]; if (d.k === 'nombre') { var nm = String(val).trim(); if (!nm || S.vehiculos.some(function (o, j) { return j !== i && o.nombre.toUpperCase() === nm.toUpperCase(); })) { el.classList.add('bad'); return; } el.classList.remove('bad'); x.nombre = nm; } else x[d.k] = val; }
  else if (d.t === 'o') { v.over[d.k] = v.over[d.k] || {}; if (val === null) delete v.over[d.k][d.p]; else v.over[d.k][d.p] = val; }
  recalc(); refresh(); guardar();
}
function mover(el, delta) {
  var d = el.dataset; if (!d.g) return;
  var n = $('[data-g="' + d.g + '"][data-r="' + (+d.r + delta) + '"][data-col="' + d.col + '"]');
  if (n) { n.focus(); if (n.select) n.select(); }
}
function nuevaCarga() {
  var v = veh(); var f = { id: uid('r'), fecha: new Date().toISOString().slice(0, 10), fact: '', llenado: 'Lleno', kmIni: null, kmFin: null, litros: null, precio: null, total: null, combustible: '', carretera: '', obs: '' };
  var prev = v.combustible[v.combustible.length - 1]; if (prev) { f.combustible = prev.combustible; f.carretera = prev.carretera; }
  v.combustible.push(f); guardar(); render(); var el = $('[data-g="c"][data-r="' + (v.combustible.length - 1) + '"][data-col="kmFin"]'); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}
function cargarEjemplo() { var e = migrar(clone(MUESTRA)); e.ui = Object.assign(e.ui, { tema: S.ui.tema, vista: 'resumen' }); S = e; guardar(); aplicarTema(); render(); toast('Datos de ejemplo cargados.'); }

function acciones(act, el) {
  var v = veh();
  switch (act) {
    case 'empezar': ir('vehiculos'); setTimeout(function () { var n = $('#nvNombre'); if (n) n.focus(); }, 0); break;
    case 'ejemplo': (S.vehiculos.length ? preguntar('Cargar datos de ejemplo', 'Se reemplazarán todos los datos actuales por el ejemplo. ¿Continuar?', 'Cargar ejemplo', true) : Promise.resolve(true)).then(function (ok) { if (ok) cargarEjemplo(); }); break;
    case 'guardarAvance': guardarAhora(); break;
    case 'reiniciar': preguntar('Reiniciar desde cero', 'Se borrarán de este navegador todos los datos de flota (vehículos, cargas, gastos, choferes) y del CRM (contactos, empresas, leads, oportunidades, pagos y campañas). Si quieres conservar una copia, usa antes "Guardar avance".', 'Borrar todo y reiniciar', true).then(function (ok) { if (!ok) return; var t = S.ui.tema; S = base(); S.ui.tema = t; S.ui.vista = 'resumen'; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} render(); toast('Plataforma reiniciada desde cero.'); }); break;
    case 'blanco': preguntar('Empezar en blanco', 'Se borrarán de este navegador los datos de flota y del CRM. Las listas y ajustes vuelven a sus valores iniciales.', 'Borrar todo', true).then(function (ok) { if (!ok) return; var t = S.ui.tema; S = base(); S.ui.tema = t; guardar(); render(); toast('Plataforma en blanco.'); }); break;
    case 'crearVeh': {
      var nm = ($('#nvNombre').value || '').trim().toUpperCase();
      if (!nm) { toast('Escribe el nombre del vehículo.'); $('#nvNombre').focus(); return; }
      if (S.vehiculos.some(function (o) { return o.nombre.toUpperCase() === nm; })) { toast('El nombre designado ya existe.'); $('#nvNombre').focus(); return; }
      var nv = { id: uid('v'), nombre: nm, tipo: $('#nvTipo').value.trim().toUpperCase(), placa: $('#nvPlaca').value.trim().toUpperCase(), chofer: $('#nvChofer').value.trim(), mes: MESES[new Date().getMonth()], combustible: [], mant: [], over: {} };
      S.vehiculos.push(nv); S.ui.veh = nv.id; guardar(); render(); toast('Vehículo creado: ' + nm); break;
    }
    case 'addCarga': nuevaCarga(); break;
    case 'addGasto': { v.mant.push({ id: uid('m'), fecha: new Date().toISOString().slice(0, 10), fact: '', tipo: '', detalle: '', importe: null }); guardar(); render(); var g = $('[data-g="m"][data-r="' + (v.mant.length - 1) + '"][data-col="tipo"]'); if (g) { g.focus(); g.scrollIntoView({ block: 'center' }); } break; }
    case 'addChofer': { S.choferes.push({ id: uid('c'), apellidos: '', nombres: '', dni: '', licencia: '', telefono: '', direccion: '', fnac: '', vehiculo: '', placa: '' }); guardar(); render(); var c = $('[data-g="ch"][data-r="' + (S.choferes.length - 1) + '"][data-col="apellidos"]'); if (c) c.focus(); break; }
    case 'aux': S.ui.aux = el.checked; guardar(); var gw = $('.gw'); if (gw) gw.classList.toggle('show-aux', el.checked); break;
    case 'print': window.print(); break;
    case 'exportJSON': respaldo(); break;
    case 'dlHtml': descargarHtml(false); break;
    case 'dlHtmlDatos': descargarHtml(true); break;
    case 'importJSON': $('#fileIn').click(); break;
    case 'csvComb': {
      var fs = R.vehiculos[v.id].filas, u = U();
      var rows = [['N', 'Fecha', 'N° Fact', 'Lleno/Parcial', 'Km inicio', 'Km termino', 'Km total', u, 'Precio', 'Total S/', 'Combustible', 'Carretera', 'Observaciones', 'Km/' + u, u + ' c/100 km', 'Costo por km', 'Km recorridos', u + ' consumidos', 'S/ acumulados']];
      v.combustible.forEach(function (r, i) { var f = fs[i]; rows.push([i + 1, r.fecha, r.fact, r.llenado, f.D, f.E, f.F, f.G, f.H, f.I, r.combustible, r.carretera, r.obs, f.N, f.O, f.P, f.Q, f.R, f.S]); });
      exportCSV('combustible-' + slug(v.nombre) + '.csv', rows); break;
    }
    case 'csvMant': { var rm = [['N', 'Fecha', 'N° Fact', 'Tipo de gasto', 'Detalle', 'Importe S/']]; v.mant.forEach(function (m, i) { rm.push([i + 1, m.fecha, m.fact, m.tipo, m.detalle, m.importe]); }); exportCSV('mantenimiento-' + slug(v.nombre) + '.csv', rm); break; }
    case 'csvChof': { var rc = [['N', 'Apellidos', 'Nombres', 'DNI', 'Licencia', 'Telefono', 'Direccion', 'F. Nac.', 'Edad', 'Vehiculo', 'Placa']]; S.choferes.forEach(function (c, i) { rc.push([i + 1, c.apellidos, c.nombres, c.dni, c.licencia, c.telefono, c.direccion, c.fnac, edad(c.fnac), c.vehiculo, c.placa]); }); exportCSV('choferes.csv', rc); break; }
    case 'csvGastos': {
      var rs = R.vehiculos[v.id].resumen, hd = ['Concepto'].concat(rs.periodos.map(perLabel), ['Total', '% gastos']), rg = [hd];
      [['Kilometros', rs.km], ['Litros', rs.litros], ['Soles combustible', rs.soles]].forEach(function (q) { rg.push([q[0]].concat(q[1].vals, [q[1].total, ''])); });
      rs.secciones.forEach(function (s, j) { rg.push([S.listas.tiposGasto[j]].concat(s.vals, [s.total, s.pct])); });
      rg.push(['Gastos del mes'].concat(rs.gastosMes, [rs.totalGastos, '']));
      exportCSV('gastos-' + slug(v.nombre) + '-' + rs.periodos[0] + '.csv', rg); break;
    }
    case 'csvFlota': { var rf = [['Vehiculo', 'Placa', 'Cargas', 'Odometro', 'Km periodo', U(), 'Km/' + U(), 'Combustible S/', 'Mantenimiento S/', 'Total S/', 'Costo por km']]; S.vehiculos.forEach(function (x) { var k = R.vehiculos[x.id].kpi; rf.push([x.nombre, x.placa, k.cargas, k.odometro, k.km, k.litros, k.rend, k.soles, k.mant, k.soles + k.mant, k.costoKm]); }); exportCSV('consolidado-flota.csv', rf); break; }
    case 'cierre': preguntar('Cerrar periodo', 'Primero se descargará un respaldo JSON. Si lo guardas, se vaciarán las bitácoras de combustible y mantenimiento de todos los vehículos.', 'Descargar y cerrar', true).then(function (ok) {
      if (!ok) return; respaldo().then(function (g) { if (!g) { toast('No se vació nada porque el respaldo no se guardó.'); return; } S.vehiculos.forEach(function (x) { x.combustible = []; x.mant = []; }); guardar(); render(); toast('Periodo cerrado. Bitácoras vacías.'); });
    }); break;
    case 'nuevoAnio': preguntar('Nuevo año', 'Se borrarán los montos que reemplazaste a mano en "Gastos anuales" (equivale a limpiar J7:U9 y J12:U25).', 'Borrar montos', true).then(function (ok) { if (!ok) return; S.vehiculos.forEach(function (x) { x.over = {}; }); guardar(); render(); toast('Montos reemplazados borrados.'); }); break;
  }
}

function eventos() {
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-v]'); if (t && t.closest('#nav')) { e.preventDefault(); ir(t.dataset.v); return; }
    t = e.target.closest('[data-go]'); if (t) { ir(t.dataset.go); return; }
    t = e.target.closest('[data-goveh]'); if (t) { e.preventDefault(); ir(t.dataset.to || 'combustible', { veh: t.dataset.goveh }); return; }
    t = e.target.closest('[data-alert]'); if (t) { var p = t.dataset.alert.split('|'); ir(p[1], { veh: p[0], fila: +p[2] }); return; }
    t = e.target.closest('#badge'); if (t) { ir('resumen'); return; }
    t = e.target.closest('#temaBtn'); if (t) { S.ui.tema = temaEfectivo() === 'dark' ? 'light' : 'dark'; aplicarTema(); guardar(); pintarTop(); return; }
    t = e.target.closest('[data-tema]'); if (t) { S.ui.tema = t.dataset.tema; aplicarTema(); guardar(); render(); return; }
    t = e.target.closest('[data-mg]'); if (t) { S.ui.modoGastos = t.dataset.mg; guardar(); render(); return; }
    t = e.target.closest('[data-anio]'); if (t) { S.ajustes.anio = +S.ajustes.anio + (+t.dataset.anio); guardar(); render(); return; }
    t = e.target.closest('[data-reset]'); if (t) {
      var q = t.dataset.reset.split('|'), v = veh();
      if (q[0] === 'c') { var r = v.combustible[+q[1]]; r.kmIni = +q[1] > 0 ? null : r.kmIni; r.precio = +q[1] > 0 ? null : r.precio; r.total = null; }
      else if (q[0] === 'o') { var o = v.over[q[1]]; if (o) R.periodos.forEach(function (pp) { delete o[pp]; }); }
      recalc(); refresh(); guardar(); toast('Fila restablecida a las fórmulas.'); return;
    }
    t = e.target.closest('[data-del]'); if (t) {
      var q2 = t.dataset.del.split('|'), v2 = veh(), i = +q2[1];
      var nom = q2[0] === 'c' ? 'la carga ' + (i + 1) : q2[0] === 'm' ? 'el gasto ' + (i + 1) : 'al chofer ' + (i + 1);
      preguntar('Eliminar', '¿Eliminar ' + nom + '? Los acumulados de las filas siguientes se recalculan.', 'Eliminar', true).then(function (ok) {
        if (!ok) return; if (q2[0] === 'c') v2.combustible.splice(i, 1); else if (q2[0] === 'm') v2.mant.splice(i, 1); else S.choferes.splice(i, 1); guardar(); render();
      }); return;
    }
    t = e.target.closest('[data-delveh]'); if (t) {
      var vv = S.vehiculos.filter(function (x) { return x.id === t.dataset.delveh; })[0];
      preguntar('Eliminar vehículo', 'Se borrarán ' + vv.nombre + ', sus ' + vv.combustible.length + ' cargas y ' + vv.mant.length + ' gastos.', 'Eliminar vehículo', true).then(function (ok) { if (!ok) return; S.vehiculos = S.vehiculos.filter(function (x) { return x !== vv; }); if (S.ui.veh === vv.id) S.ui.veh = null; guardar(); render(); }); return;
    }
    t = e.target.closest('button[data-act]'); if (t) { acciones(t.dataset.act, t); return; }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.matches('input.cell,input.f[data-t]') && el.type !== 'date') { aplicarEdicion(el); return; }
    if (el.matches('[data-aj]') && el.tagName === 'INPUT') { var k = el.dataset.aj; if (k === 'anio') { var y = parseInt(el.value, 10); if (y >= 2000 && y <= 2100) { S.ajustes.anio = y; recalc(); pintarTop(); guardar(); } } else { S.ajustes[k] = el.value; guardar(); pintarNav(); pintarTop(); } return; }
    if (el.matches('textarea[data-lista]')) { var arr = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); S.listas[el.dataset.lista] = arr.filter(function (x, i) { return arr.indexOf(x) === i; }); recalc(); pintarBadge(); guardar(); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'vehSel') { S.ui.veh = el.value; guardar(); render(); return; }
    if (el.id === 'fileIn') { importar(el.files[0]); el.value = ''; return; }
    if (el.matches('input[type=checkbox][data-act]')) { acciones(el.dataset.act, el); return; }
    if (el.matches('select[data-aj]')) { var k = el.dataset.aj, val = el.value; S.ajustes[k] = k === 'mesInicio' ? +val : k === 'preciosConIGV' ? val === '1' : val; guardar(); render(); return; }
    if (el.matches('select.cell,input[type=date].cell,select.f[data-t]')) { aplicarEdicion(el); if (el.dataset.t === 'vh' && S.ui.vista === 'vehiculos') return; return; }
  });
  document.addEventListener('focusin', function (e) { var el = e.target; if (el.matches && el.matches('input[data-dec]')) { var st = el.classList.contains('sug') ? resolve(el.dataset.d) : parseNum(el.value); if (st !== null && !isNaN(st) && !Motor.isErr(st)) el.value = String(Math.round(st * 1e6) / 1e6); if (el.select) el.select(); } });
  document.addEventListener('focusout', function (e) { var el = e.target; if (el.matches && el.matches('input[data-dec]') && !el.classList.contains('bad')) { var n = parseNum(el.value); if (n === null && el.classList.contains('sug')) el.value = fmtIn(resolve(el.dataset.d), +el.dataset.dec); else if (n !== null) el.value = fmtIn(n, +el.dataset.dec); } if (el.matches && el.matches('[data-t="vh"][data-k="nombre"]')) { pintarTop(); } });
  document.addEventListener('keydown', function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.g) return;
    if (e.key === 'Enter') { e.preventDefault(); mover(el, e.shiftKey ? -1 : 1); }
  });
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { if (S.ui.tema === 'auto') pintarTop(); }); }
}
function importar(file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    var o; try { o = JSON.parse(fr.result); } catch (e) { toast('El archivo no es JSON válido.'); return; }
    var errs = validar(o); if (errs.length) { toast('Respaldo no válido: ' + errs[0]); return; }
    preguntar('Importar respaldo', 'Se reemplazarán los datos actuales por los del archivo (' + o.vehiculos.length + ' vehículos).', 'Importar', true).then(function (ok) { if (!ok) return; var t = S.ui.tema; S = migrar(o); S.ui.tema = t; guardar(); aplicarTema(); render(); toast('Respaldo importado.'); });
  };
  fr.readAsText(file, 'utf-8');
}

function descargarHtml(conDatos) {
  var marca = '/*' + 'EMB*/', p = PRISTINE.split(marca);
  if (p.length !== 3) { toast('No se pudo preparar la copia del archivo.'); return; }
  var datos = conDatos ? JSON.stringify(S).replace(/</g, '\\u003c') : 'null';
  var html = p[0] + marca + datos + marca + p[2];
  var n = new Date(), d = new Date(n.getTime() - n.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  guardarArchivo('coseinco-plataforma' + (conDatos ? '-datos-' + d : '') + '.html', html, 'text/html;charset=utf-8');
}

/* igv por fila (columna informativa añadida) */
var _resolve = resolve;
resolve = function (key) {
  if (key.indexOf('igv|') === 0) { if (!S.ajustes.preciosConIGV) return null; var t = _resolve('c|' + key.slice(4) + '|I'); return Motor.isErr(t) || t === null ? t : t - t / (1 + IGV); }
  if (key === 'igvt') { if (!S.ajustes.preciosConIGV) return null; var tt = _resolve('cs|I'); return Motor.isErr(tt) || tt === null ? tt : tt - tt / (1 + IGV); }
  if (key.indexOf('ch|') === 0) return edad((S.choferes[+key.split('|')[1]] || {}).fnac);
  return _resolve(key);
};

CRMUI.init({ S: function () { return S; }, R: function () { return R; }, save: guardar, render: render, ir: ir, toast: toast, preguntar: preguntar, esc: esc, money: money, nf: nf, paintVal: paintVal,
  exportCSV: exportCSV, uid: uid, ventana: ventana, perLabel: perLabel, M3: M3, descargarHtml: descargarHtml });
S = cargar(); aplicarTema(); eventos(); prepDownloads(); render();
window.__app = { get S() { return S; }, get R() { return R; }, ir: ir, render: render };
})();

</script>
